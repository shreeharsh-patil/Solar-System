<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title description">
<title id="title">SOLARIS — an animated Solar System</title>
<desc id="description">A stylized Sun surrounded by eight planets moving along elliptical orbits, alongside the SOLARIS project title. Orbital periods and distances are illustrative, not to scale.</desc>
<defs>
  <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070d20"/><stop offset=".56" stop-color="#0b142c"/><stop offset="1" stop-color="#050919"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#ffcc75" stop-opacity=".68"/><stop offset=".3" stop-color="#f78b39" stop-opacity=".22"/><stop offset="1" stop-color="#eb7232" stop-opacity="0"/></radialGradient>
  <radialGradient id="sun"><stop stop-color="#fffbe4"/><stop offset=".38" stop-color="#ffdb78"/><stop offset=".85" stop-color="#f69a37"/><stop offset="1" stop-color="#ec6a30"/></radialGradient>
  <filter id="planet-glow"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="frame"><rect width="1280" height="440" rx="24"/></clipPath>
</defs>
<style>
  @keyframes revolution { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes glow { 0%,100% {opacity:.75} 50% {opacity:1} }
  .orbiting { transform-origin: 0px 0px; animation-name: revolution; animation-timing-function: linear; animation-iteration-count: infinite; }
  .sun-aura { animation: glow 5s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .orbiting, .sun-aura { animation: none !important; } }
</style>
